<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Checkmark with neural circuit -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#logoGradient)" stroke-width="4"/>
  
  <!-- Checkmark -->
  <path d="M 65 100 L 90 125 L 135 75" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Neural circuit nodes -->
  <circle cx="60" cy="60" r="4" fill="#58a6ff"/>
  <circle cx="140" cy="60" r="4" fill="#58a6ff"/>
  <circle cx="60" cy="140" r="4" fill="#3fb950"/>
  <circle cx="140" cy="140" r="4" fill="#3fb950"/>
  
  <!-- Connecting lines -->
  <line x1="60" y1="60" x2="90" y2="90" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="60" x2="110" y2="90" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <line x1="60" y1="140" x2="90" y2="110" stroke="#3fb950" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="140" x2="110" y2="110" stroke="#3fb950" stroke-width="2" opacity="0.6"/>
  
  <!-- Text -->
  <text x="100" y="190" font-family="Orbitron, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)">ExamEval AI</text>
</svg>
